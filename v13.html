attempt('Ciclo e identidade',function(){var a={nome:'raiz'};a.self=a;a.child={parent:a};var b=structuredClone(a);return 'ciclo='+(b.self===b)+' parent='+(b.child.parent===b)+' independente='+(b!==a)});

</script></body></html>
