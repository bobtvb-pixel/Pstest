<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 Diagnóstico V9</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#1547bd,#071442 75%);color:#e5f5ff;font:17px Arial,sans-serif;padding:18px}main{max-width:1000px;margin:auto;border:2px solid #368bff;border-radius:16px;background:#082a85;padding:22px;box-shadow:0 0 30px #1462f855}h1{margin:0 0 12px;font-size:28px}p{line-height:1.45}button{background:#0876e1;color:white;border:1px solid #9deaff;border-radius:9px;padding:12px 16px;margin:5px 5px 10px 0;font-size:16px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#061b5c;border-radius:9px;padding:16px;min-height:200px;line-height:1.5}small{color:#b5d5fa}</style></head><body><main><h1>PS4 | Diagnóstico V9</h1><p>Verificação dos pré-requisitos JavaScript do core.js. Sem exploit, payload ou acesso à memória nativa.</p><button id="run">INICIAR DIAGNÓSTICO V9</button><button id="copy" disabled>COPIAR JSON</button><button id="save" disabled>EXPORTAR JSON</button><pre id="log">Pronto para iniciar.</pre><small>Testes locais, limitados e sem conexões externas.</small></main>
<script>
(function(){
var run=document.getElementById('run'),copy=document.getElementById('copy'),save=document.getElementById('save'),log=document.getElementById('log'),report=null;
function line(s){log.textContent+=s+'\n'}
function test(name,fn){try{var r=fn();report.tests.push({name:name,result:r?'OK':'FALHA'});line(name+': '+(r?'OK':'FALHA'))}catch(e){report.tests.push({name:name,result:'ERRO',detail:String(e)});line(name+': ERRO '+String(e))}}
function finish(){line('--- FIM: nenhuma exploração executada ---');run.disabled=false;copy.disabled=false;save.disabled=false}
run.onclick=function(){run.disabled=true;copy.disabled=true;save.disabled=true;log.textContent='';var ua=navigator.userAgent;var m=/PlayStation\s*4\/(\d+\.\d+)/i.exec(ua);report={version:'V9',timestamp:new Date().toISOString(),firmware:m?m[1]:null,userAgent:ua,tests:[]};line('Firmware informado: '+(report.firmware||'não identificado'));line('User-Agent: '+ua);line('--- APIs ---');test('BigInt',function(){return typeof BigInt==='function'&&BigInt('9007199254740993')-BigInt('9007199254740992')===BigInt(1)});test('Symbol',function(){return typeof Symbol==='function'&&Symbol('v9')!==Symbol('v9')});test('MessageChannel API',function(){return typeof MessageChannel==='function'});test('history.replaceState API',function(){return typeof history!=='undefined'&&typeof history.replaceState==='function'});test('Structured clone por MessageChannel',function(){return typeof MessageChannel==='function'});line('--- History API ---');try{if(typeof history.replaceState!=='function')throw Error('API indisponível');var before=history.state;var token='v9-'+Date.now();history.replaceState({v9:token},document.title,location.href);var ok=!!history.state&&history.state.v9===token;history.replaceState(before,document.title,location.href);report.tests.push({name:'replaceState leitura/restauração',result:ok?'OK':'FALHA'});line('replaceState leitura/restauração: '+(ok?'OK':'FALHA'))}catch(e){report.tests.push({name:'replaceState leitura/restauração',result:'ERRO',detail:String(e)});line('replaceState: ERRO '+String(e))}
line('--- Comunicação assíncrona ---');if(typeof MessageChannel!=='function'){finish();return}var channel,ended=false;try{channel=new MessageChannel();var start=Date.now();function end(result,detail){if(ended)return;ended=true;report.tests.push({name:'MessageChannel roundtrip',result:result,detail:detail||'',elapsed_ms:Date.now()-start});line('MessageChannel roundtrip: '+result+(detail?' ('+detail+')':''));try{channel.port1.close();channel.port2.close()}catch(e){}finish()}channel.port2.onmessage=function(e){try{channel.port2.postMessage({answer:e.data.value+1,label:e.data.label})}catch(err){end('ERRO',String(err))}};channel.port1.onmessage=function(e){end(e.data&&e.data.answer===42&&e.data.label==='v9'?'OK':'FALHA')};channel.port1.postMessage({value:41,label:'v9'});setTimeout(function(){end('TIMEOUT','2500 ms')},2500)}catch(e){report.tests.push({name:'MessageChannel roundtrip',result:'ERRO',detail:String(e)});line('MessageChannel: ERRO '+String(e));finish()}};
copy.onclick=function(){if(!report)return;var s=JSON.stringify(report,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){line('JSON copiado.')},function(){line('Cópia indisponível.')})}else{var a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{line(document.execCommand('copy')?'JSON copiado.':'Cópia indisponível.')}catch(e){line('Cópia indisponível.')}document.body.removeChild(a)}};
save.onclick=function(){if(!report)return;try{var u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='ps4-v9.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(e){line('Exportação indisponível: '+String(e))}};
})();
</script></body></html>
