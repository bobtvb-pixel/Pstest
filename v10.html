<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 14.00 | Diagnóstico V10</title><style>body{margin:0;background:#0a1020;color:#eaf2ff;font:16px Arial,sans-serif;padding:18px}main{max-width:760px;margin:auto}h1{font-size:24px;color:#72c9ff}.panel{background:#17243b;padding:16px;border-radius:12px;margin:12px 0}button{background:#2b82f6;border:0;border-radius:9px;color:white;padding:14px;font-size:17px;margin:5px 5px 5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#b5c5df}</style></head><body><main><h1>PS4 14.00 • Diagnóstico V10</h1><p>Verificações não invasivas. Nenhum exploit ou payload é executado.</p><div class="panel"><button onclick="run()">Iniciar diagnóstico</button><button onclick="copyReport()">Selecionar relatório</button><small id="status">Aguardando teste</small></div><div class="panel"><pre id="report">Clique em Iniciar diagnóstico.</pre></div></main><script>
var reportText='';
function test(label,fn){try{return {teste:label,resultado:fn()}}catch(e){return {teste:label,erro:String(e&&e.message||e)}}}
function run(){var a=[];a.push({teste:'Data UTC',resultado:new Date().toISOString()});a.push({teste:'User-Agent',resultado:navigator.userAgent});a.push({teste:'URL',resultado:location.protocol+'//'+location.host+location.pathname});a.push(test('BigInt',function(){return typeof BigInt}));a.push(test('Symbol',function(){return typeof Symbol}));a.push(test('Proxy',function(){return typeof Proxy}));a.push(test('MessageChannel',function(){return typeof MessageChannel}));a.push(test('structuredClone',function(){return typeof structuredClone}));a.push(test('WebAssembly',function(){return typeof WebAssembly}));a.push(test('history.replaceState (API)',function(){return typeof history.replaceState}));a.push(test('ArrayBuffer 1 KiB',function(){var b=new ArrayBuffer(1024);return b.byteLength}));a.push(test('Uint8Array leitura/escrita',function(){var x=new Uint8Array(16);x[3]=42;return x[3]===42?'OK':'Falha'}));a.push(test('Symbol descrição',function(){return String(Symbol('v10'))}));a.push(test('JSON serialização comum',function(){return JSON.stringify({a:1,b:[2,3]})}));a.push(test('URLSearchParams',function(){return typeof URLSearchParams}));a.push(test('Performance.now',function(){return typeof performance!=='undefined'&&typeof performance.now==='function'?'disponível':'indisponível'}));reportText=JSON.stringify({projeto:'PS4 browser V10',observacao:'Testes de APIs públicas; não demonstram exploitabilidade',resultados:a},null,2);document.getElementById('report').textContent=reportText;document.getElementById('status').textContent='Concluído: '+a.length+' verificações';}
function copyReport(){var el=document.getElementById('report');if(!reportText){document.getElementById('status').textContent='Execute o diagnóstico primeiro';return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(reportText).then(function(){document.getElementById('status').textContent='Relatório copiado';},function(){selectReport(el)});}else{selectReport(el)}}function selectReport(el){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);document.getElementById('status').textContent='Texto selecionado; copie manualmente';}
</script></body></html>
