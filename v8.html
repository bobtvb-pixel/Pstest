<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 Diagnóstico V8</title><style>body{background:#061a61;color:#d8f6ff;font:18px Arial;margin:0;padding:20px}main{max-width:1000px;margin:auto;background:#0731b1;border:2px solid #3183ff;border-radius:16px;padding:22px}h1{font-size:28px}button{background:#0877db;color:white;border:1px solid #9de5ff;border-radius:8px;padding:12px;font-size:17px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}small{color:#bdd5ff}</style></head><body><main><h1>PS4 | Diagnóstico V8</h1><p>Verificação de compatibilidade do host. Nenhuma cadeia de exploração é carregada.</p><button id="run">INICIAR V8</button><button id="copy" disabled>COPIAR RELATÓRIO</button><button id="save" disabled>EXPORTAR JSON</button><pre id="out">Aguardando teste.</pre><small>Firmware 14.00: sem suporte verificado no pacote rawgame4 analisado.</small></main><script>(function(){var out=document.getElementById('out'),run=document.getElementById('run'),copy=document.getElementById('copy'),save=document.getElementById('save'),report=null;function show(s){out.textContent+=s+'\n'}run.onclick=function(){out.textContent='';var ua=navigator.userAgent,m=/PlayStation\s*4[\\/ ](\\d+)\\.(\\d+)/i.exec(ua),fw=m?m[1]+'.'+m[2]:null;var known=['10.01','11.00','11.50','12.00','12.02','12.50','12.52','13.00'];var apis=['ArrayBuffer','DataView','Uint8Array','BigInt','Worker','MessageChannel','Promise','WebAssembly','SharedArrayBuffer','Atomics'];report={diagnostic:'V8',timestamp:new Date().toISOString(),url:location.href,userAgent:ua,firmware:fw,listedInPackage:known.indexOf(fw)!==-1,apiTypes:{},notes:[]};show('PS4 Diagnóstico V8');show('Firmware informado: '+(fw||'não identificado'));show('User-Agent: '+ua);show('--- Referência estática rawgame4 ---');show('Firmware listado no pacote: '+(report.listedInPackage?'SIM':'NÃO'));show('Observação: a presença na lista não comprova funcionamento.');if(fw==='14.00')report.notes.push('14.00 não consta na lista do pacote analisado.');show('--- APIs ---');apis.forEach(function(k){report.apiTypes[k]=typeof window[k];show(k+': '+report.apiTypes[k])});show('--- Verificação segura ---');try{var b=new ArrayBuffer(16),v=new DataView(b);v.setUint32(0,305419896,true);report.bufferCheck=v.getUint32(0,true)===305419896?'OK':'FALHA';}catch(e){report.bufferCheck='ERRO: '+String(e)}show('DataView: '+report.bufferCheck);show('--- Resultado ---');show('Nenhum exploit, offset ou payload foi executado.');copy.disabled=false;save.disabled=false};copy.onclick=function(){if(!report)return;var txt=JSON.stringify(report,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){show('Relatório copiado.')},function(){show('Cópia indisponível neste navegador.')})}else{var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{show(document.execCommand('copy')?'Relatório copiado.':'Cópia indisponível.')}catch(e){show('Cópia indisponível.')}document.body.removeChild(t)}};save.onclick=function(){if(!report)return;try{var u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='ps4-v8.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(e){show('Exportação indisponível: '+String(e))}}})();</script></body></html>
