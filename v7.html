<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 Diagnóstico V7</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1452d8,#061847 75%);color:#d9f5ff;font:18px Arial,sans-serif;min-height:100vh;padding:20px}.panel{max-width:1150px;margin:auto;border:2px solid #3679ff;border-radius:16px;background:#072c89;padding:22px;box-shadow:0 0 30px #1658f0}h1{margin:0 0 12px;font-size:30px}button{font:inherit;padding:13px 18px;margin:5px;border-radius:8px;background:#0c63ce;color:white;border:1px solid #8ad8ff}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#031c5c;padding:18px;border-radius:9px;line-height:1.5;font-size:16px}small{color:#b2d6ff}</style></head><body><div class="panel"><h1>PS4 | Diagnóstico V7</h1><p>Compatibilidade e estabilidade controlada. Nenhuma exploração, payload ou acesso à memória nativa.</p><button id="start">INICIAR V7</button><button id="download" disabled>EXPORTAR JSON</button><button id="copy" disabled>COPIAR RELATÓRIO</button><pre id="output">Aguardando início.</pre><small>Testes finitos, com alocação máxima de 1 MiB por buffer e timeout para worker.</small></div><script>
(function(){'use strict';var out=document.getElementById('output'),start=document.getElementById('start'),download=document.getElementById('download'),copy=document.getElementById('copy'),report=null;function say(x){out.textContent+=x+'\n'}function test(name,fn){var t=Date.now();try{var ok=fn();report.tests.push({name:name,status:ok?'OK':'FALHA',ms:Date.now()-t});say(name+': '+(ok?'OK':'FALHA'))}catch(e){report.tests.push({name:name,status:'ERRO',error:String(e),ms:Date.now()-t});say(name+': ERRO '+String(e))}}function finish(){say('--- Finalizado: nenhuma exploração executada ---');start.disabled=false;download.disabled=false;copy.disabled=false}start.onclick=function(){start.disabled=true;download.disabled=true;copy.disabled=true;out.textContent='';report={version:'V7',date:new Date().toISOString(),userAgent:navigator.userAgent,url:location.href,features:{},tests:[],benchmarks:[]};say('PS4 | Diagnóstico V7\n'+report.date+'\n'+report.userAgent);['WebAssembly','SharedArrayBuffer','Atomics','Worker','MessageChannel','BigInt','Promise','fetch'].forEach(function(k){report.features[k]=typeof window[k]});say('--- APIs ---');Object.keys(report.features).forEach(function(k){say(k+': '+report.features[k])});say('--- Compatibilidade ---');test('DataView little/big endian',function(){var b=new ArrayBuffer(8),v=new DataView(b);v.setUint32(0,0x12345678,true);v.setUint32(4,0x12345678,false);return v.getUint8(0)===0x78&&v.getUint8(4)===0x12});test('TypedArray subarray',function(){var a=new Uint8Array([1,2,3,4]);var b=a.subarray(1,3);b[0]=9;return a[1]===9&&b.length===2});test('BigInt 64-bit aritmética',function(){if(typeof BigInt!=='function')return false;var a=BigInt('18446744073709551615');return (a-BigInt(1))===BigInt('18446744073709551614')});test('JSON roundtrip',function(){return JSON.parse(JSON.stringify({a:[1,2,3]})).a[2]===3});test('Exceções',function(){try{throw new Error('teste')}catch(e){return e.message==='teste'}});test('Alocação controlada 1 MiB',function(){var a=new Uint8Array(1024*1024);a[0]=7;a[a.length-1]=9;return a[0]===7&&a[a.length-1]===9});say('--- Repetibilidade ---');for(var j=0;j<5;j++){var t=Date.now(),s=0;for(var i=0;i<50000;i++)s+=i%17;var ms=Date.now()-t;report.benchmarks.push({round:j+1,ms:ms,checksum:s});say('Rodada '+(j+1)+': '+ms+' ms, checksum '+s)}say('--- Assíncrono ---');var timerStart=Date.now();setTimeout(function(){report.timer_ms=Date.now()-timerStart;say('Timer: '+report.timer_ms+' ms');workerTest()},100)};function workerTest(){if(typeof Worker!=='function'||typeof Blob!=='function'||!URL.createObjectURL){say('Worker: indisponível');report.worker={status:'indisponível'};finish();return}var url=null,w=null,done=false,t=Date.now();function end(status){if(done)return;done=true;report.worker={status:status,ms:Date.now()-t};say('Worker: '+status+' ('+report.worker.ms+' ms)');if(w)w.terminate();if(url)URL.revokeObjectURL(url);finish()}try{url=URL.createObjectURL(new Blob(['onmessage=function(e){var a=e.data;postMessage({length:a.byteLength,first:new Uint8Array(a)[0]})}'],{type:'application/javascript'}));w=new Worker(url);w.onmessage=function(e){end(e.data.length===1024&&e.data.first===42?'OK':'FALHA')};w.onerror=function(){end('ERRO')};var b=new ArrayBuffer(1024);new Uint8Array(b)[0]=42;w.postMessage(b,[b]);setTimeout(function(){end('TIMEOUT')},3000)}catch(e){end('ERRO '+String(e))}}download.onclick=function(){if(!report)return;var blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ps4-v7-report.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1500)};copy.onclick=function(){if(!report)return;var text=JSON.stringify(report,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){say('Relatório copiado.')},function(){say('Cópia não suportada; use exportação JSON.')})}else{say('Clipboard indisponível; use exportação JSON.')}}})();
</script></body></html>
