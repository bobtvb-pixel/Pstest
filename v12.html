<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 14.00 | Diagnóstico V12</title><style>body{margin:0;background:#07142e;color:#e9f2ff;font:18px Arial,sans-serif;padding:24px;box-sizing:border-box}main{max-width:950px;margin:auto}h1{font-size:30px}p{line-height:1.5}button{background:#1584ed;color:white;border:0;border-radius:10px;padding:16px;margin:6px 8px 12px 0;font-size:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1045a3;padding:20px;border-radius:12px;font-size:16px;line-height:1.5}small{color:#c4d5ee}</style></head><body><main><h1>PS4 14.00 | Diagnóstico V12</h1><p>Testes seguros de clonagem e serialização de objetos pequenos. Sem exploit, payload ou manipulação de memória.</p><button id="run">Iniciar V12</button><button id="copy">Copiar relatório</button><p id="status">Aguardando início.</p><pre id="out">Nenhum teste executado.</pre><small>O resultado caracteriza APIs públicas e não comprova a presença ou ausência de vulnerabilidades.</small></main><script>(function(){'use strict';var out=document.getElementById('out'),status=document.getElementById('status'),report=null;function result(name,fn){try{return {teste:name,resultado:String(fn())}}catch(e){return {teste:name,resultado:'EXCEÇÃO: '+e.name+': '+e.message}}}function clone(v){if(typeof structuredClone!=='function')return 'API indisponível';return structuredClone(v)}function run(){var tests=[];tests.push(result('JSON objeto comum',function(){return JSON.stringify({a:1,b:[2,3]})}));tests.push(result('JSON referência circular',function(){var o={nome:'circular'};o.self=o;return JSON.stringify(o)}));tests.push(result('structuredClone objeto comum',function(){var c=clone({a:1,b:[2,3]});return JSON.stringify(c)}));tests.push(result('structuredClone referência circular',function(){var o={nome:'circular'};o.self=o;var c=clone(o);return c.self===c?'ciclo preservado':'ciclo não preservado'}));tests.push(result('structuredClone função',function(){return typeof clone({f:function(){}}).f}));tests.push(result('structuredClone Symbol',function(){return String(clone(Symbol('v12')))}));tests.push(result('structuredClone BigInt',function(){if(typeof BigInt!=='function')return 'BigInt indisponível';var c=clone({n:BigInt(42)});return String(c.n)}));tests.push(result('structuredClone ArrayBuffer pequeno',function(){var b=new ArrayBuffer(16),v=new Uint8Array(b);v[0]=42;var c=clone(b);return c.byteLength+' bytes, primeiro byte '+new Uint8Array(c)[0]}));tests.push(result('history.replaceState objeto pequeno',function(){if(!history||typeof history.replaceState!=='function')return 'API indisponível';var original=history.state;history.replaceState({v12:true,lista:[1,2]},'');var ok=history.state&&history.state.v12===true;history.replaceState(original,'');return ok?'OK (estado restaurado)':'estado inesperado'}));report={versao:'V12',dataUTC:new Date().toISOString(),userAgent:navigator.userAgent,resultados:tests};out.textContent=JSON.stringify(report,null,2);status.textContent='Concluído. '+tests.length+' testes registrados.'}document.getElementById('run').onclick=run;document.getElementById('copy').onclick=function(){var s=out.textContent;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){status.textContent='Relatório copiado.'},function(){status.textContent='Cópia bloqueada. Fotografe o relatório.'})}else{status.textContent='Cópia indisponível neste navegador. Fotografe o relatório.'}}})();</script></body></html>
