</style></head><body><main class="wrap"><h1>PS4 | Diagnóstico V5</h1><p class="sub">Firmware 14.00 • Compatibilidade WebKit / JavaScript • Testes seguros</p><div class="actions"><button id="start">INICIAR DIAGNÓSTICO V5</button><button id="export" class="secondary" disabled>EXPORTAR JSON</button><button id="copy" class="secondary" disabled>COPIAR RELATÓRIO</button></div><section class="panel"><pre id="log">Aguardando início do diagnóstico V5.</pre></section><p class="note">Este diagnóstico não explora vulnerabilidades, não acessa memória nativa nem executa payloads.</p></main><script>
(function(){'use strict';var log=document.getElementById('log'),start=document.getElementById('start'),exp=document.getElementById('export'),copy=document.getElementById('copy'),report=null,lines=[];
function out(s){lines.push(s);log.textContent=lines.join('\n');}function record(group,name,value){report.tests.push({group:group,name:name,result:String(value)});out(name+': '+value);}function check(group,name,fn){try{record(group,name,fn());}catch(e){record(group,name,'ERRO ('+(e&&e.name||'desconhecido')+')');}}
function runWorker(done){if(typeof Worker!=='function'||typeof Blob!=='function'||typeof URL==='undefined'||typeof URL.createObjectURL!=='function'){record('async','Web Worker','API indisponível');done();return;}var url=null,w=null,finished=false,t0=Date.now(),timer;function finish(v){if(finished)return;finished=true;clearTimeout(timer);record('async','Web Worker',v);try{if(w)w.terminate();if(url)URL.revokeObjectURL(url);}catch(e){}done();}try{url=URL.createObjectURL(new Blob(['self.onmessage=function(e){self.postMessage(e.data+1)}'],{type:'application/javascript'}));w=new Worker(url);w.onmessage=function(e){finish(e.data===42?'OK ('+(Date.now()-t0)+' ms)':'resposta inesperada');};w.onerror=function(){finish('erro de execução');};timer=setTimeout(function(){finish('timeout (3000 ms)');},3000);w.postMessage(41);}catch(e){finish('indisponível ('+e.name+')');}}
function run(){start.disabled=true;exp.disabled=true;copy.disabled=true;lines=[];report={version:'V5',timestamp:new Date().toISOString(),userAgent:navigator.userAgent,url:location.href,tests:[]};out('PS4 | Diagnóstico V5');out('Data: '+new Date().toString());out('URL: '+location.href);out('User-Agent: '+navigator.userAgent);out('--- Ambiente ---');check('ambiente','HTTPS',function(){return location.protocol==='https:'?'SIM':'NÃO';});check('ambiente','Contexto seguro',function(){return String(window.isSecureContext);});['WebAssembly','SharedArrayBuffer','Atomics','caches','applicationCache','fetch','AbortController','MessageChannel','queueMicrotask','Worker','Promise'].forEach(function(n){check('apis',n,function(){return typeof window[n];});});out('--- JavaScript Engine ---');check('js','ArrayBuffer/DataView',function(){var a=new ArrayBuffer(16),v=new DataView(a);v.setUint32(0,0x12345678,true);return v.getUint32(0,true)===0x12345678?'OK':'FALHA';});check('js','TypedArray',function(){var a=new Uint8Array(8);a[0]=21;a[7]=34;return a[0]+a[7]===55?'OK':'FALHA';});check('js','BigInt 64 bits',function(){if(typeof BigInt!=='function'||typeof BigUint64Array!=='function')return 'indisponível';var a=new BigUint64Array(1);a[0]=BigInt('4294967297');return a[0]===BigInt('4294967297')?'OK':'FALHA';});check('js','JSON',function(){return JSON.parse(JSON.stringify({a:1,b:[2,3]})).b[1]===3?'OK':'FALHA';});check('js','Exceção capturada',function(){try{throw new Error('teste');}catch(e){return e.message==='teste'?'OK':'FALHA';}});out('--- Memória JavaScript (limite 1 MiB) ---');check('memoria','Alocação 1 MiB',function(){var a=new Uint8Array(1024*1024);for(var i=0;i<a.length;i+=4096)a[i]=i/4096%256;var ok=a[4096]===1&&a[8192]===2;a=null;return ok?'OK':'FALHA';});out('--- Assíncrono ---');var p=typeof Promise==='function'?Promise.resolve(42):null;if(!p){record('async','Promise','indisponível');afterPromise();}else{p.then(function(v){record('async','Promise',v===42?'OK':'FALHA');afterPromise();},function(){record('async','Promise','erro');afterPromise();});}function afterPromise(){var t=Date.now();setTimeout(function(){record('async','Timer','OK ('+(Date.now()-t)+' ms)');runWorker(function(){out('--- Final ---');out('Diagnóstico concluído. Nenhuma exploração executada.');start.disabled=false;exp.disabled=false;copy.disabled=false;});},25);}}
start.onclick=run;exp.onclick=function(){if(!report)return;var content=JSON.stringify(report,null,2);try{var blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ps4-diagnostico-v5.json';document.body.appendChild(a);a.click();a.parentNode.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1000);}catch(e){out('Exportação não suportada. Use COPIAR RELATÓRIO.');}};copy.onclick=function(){var text=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fallback();});}else fallback();function fallback(){var a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(a);}};
})();
