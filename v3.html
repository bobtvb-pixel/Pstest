<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 | Diagnóstico seguro V3</title><style>body{background:#08162d;color:#e8f4ff;font:18px Arial,sans-serif;margin:0;padding:25px}main{max-width:950px;margin:auto}h1{color:#27c9ff;font-size:30px}p{line-height:1.5}button{background:#09b6ee;border:0;border-radius:8px;padding:15px 20px;color:#002039;font-weight:bold;font-size:17px;margin:5px 8px 10px 0;cursor:pointer}pre{background:#123a78;border-radius:9px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font:16px Arial,sans-serif}.note{color:#b7d4ee}</style></head><body><main><h1>PS4 | Diagnóstico avançado V3</h1><p>Testes comuns de JavaScript e segurança. Sem exploit, payload, offsets ou acesso ao kernel.</p><button onclick="run()">Executar diagnóstico</button><button onclick="copyReport()">Copiar relatório</button><pre id="log">Pronto para testar.</pre><p class="note">Caso o botão Copiar não funcione no PS4, fotografe os resultados.</p></main><script>
var lines=[];function log(s){lines.push(s);document.getElementById('log').textContent=lines.join('\n')}
function test(name,fn){try{log(name+': '+fn())}catch(e){log(name+': ERRO ('+e.name+': '+e.message+')')}}
function copyReport(){var s=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){alert('Relatório copiado')},function(){alert('Cópia indisponível; fotografe a tela')})}else{var t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(t);alert(ok?'Relatório copiado':'Cópia indisponível; fotografe a tela')}}
function run(){lines=[];log('PS4 | Diagnóstico V3');log('Data: '+new Date().toString());log('User-Agent: '+navigator.userAgent);log('URL: '+location.href);log('');test('Contexto seguro',function(){return String(window.isSecureContext)});test('HTTPS',function(){return location.protocol==='https:'?'SIM':'NÃO'});test('crossOriginIsolated',function(){return typeof crossOriginIsolated==='undefined'?'indisponível':String(crossOriginIsolated)});test('SharedArrayBuffer',function(){return typeof SharedArrayBuffer==='function'?'disponível':'indisponível'});test('Atomics',function(){return typeof Atomics==='object'?'disponível':'indisponível'});test('BigInt/DataView 64-bit',function(){if(typeof BigInt!=='function')return 'BigInt indisponível';var d=new DataView(new ArrayBuffer(8));if(typeof d.setBigUint64!=='function'||typeof d.getBigUint64!=='function')return 'métodos BigUint64 indisponíveis';var n=BigInt('1234567890123456789');d.setBigUint64(0,n,true);return d.getBigUint64(0,true)===n?'OK':'FALHOU'});test('ArrayBuffer/DataView',function(){var b=new ArrayBuffer(16),v=new DataView(b);v.setUint32(0,0x12345678,true);return v.getUint32(0,true)===0x12345678?'OK':'FALHOU'});test('Atomics operação normal',function(){if(typeof SharedArrayBuffer!=='function'||typeof Atomics!=='object')return 'não aplicável';var a=new Int32Array(new SharedArrayBuffer(4));Atomics.store(a,0,17);return Atomics.load(a,0)===17?'OK':'FALHOU'});log('Web Worker transferência: iniciando...');if(typeof Worker!=='function'||typeof Blob!=='function'||!URL.createObjectURL){log('Web Worker transferência: API indisponível');return}var source='self.onmessage=function(e){var b=e.data;var v=new Uint8Array(b);self.postMessage({size:b.byteLength,value:v[0]})}';var url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));var worker,finished=false;var timer=setTimeout(function(){finish('TIMEOUT')},6000);function finish(msg){if(finished)return;finished=true;clearTimeout(timer);log('Web Worker transferência: '+msg);if(worker)worker.terminate();URL.revokeObjectURL(url);log('Diagnóstico concluído.')}try{worker=new Worker(url);worker.onmessage=function(e){finish(e.data.size===8&&e.data.value===42?'OK':'RESPOSTA INESPERADA')};worker.onerror=function(){finish('ERRO no Worker')};var b=new ArrayBuffer(8);new Uint8Array(b)[0]=42;worker.postMessage(b,[b]);log('ArrayBuffer após transferência: '+(b.byteLength===0?'destacado corretamente':'tamanho '+b.byteLength))}catch(e){finish('ERRO ('+e.name+': '+e.message+')')}}
</script></body></html>
