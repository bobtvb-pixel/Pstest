<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 | Diagnóstico V2</title><style>body{background:#09162c;color:#e7f4ff;font:17px Arial,sans-serif;margin:0;padding:25px}main{max-width:900px;margin:auto}h1{color:#32c6ff}button{background:#05a9f5;color:white;border:0;border-radius:9px;padding:15px 22px;font-size:17px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#12365d;padding:20px;border-radius:10px;line-height:1.6}</style></head><body><main><h1>PS4 | Diagnóstico avançado V2</h1><p>Testes comuns de JavaScript. Sem exploit, payload ou acesso ao kernel.</p><button id="run">Executar diagnóstico</button><pre id="log">Aguardando...</pre></main><script>(function(){var log=document.getElementById('log');function write(s){log.textContent+='\n'+s}document.getElementById('run').onclick=function(){log.textContent='Diagnóstico iniciado';write('User-Agent: '+navigator.userAgent);write('Endereço: '+location.href);try{var a=new ArrayBuffer(16),v=new DataView(a);v.setUint32(0,0x12345678,true);write('ArrayBuffer/DataView: '+(v.getUint32(0,true)===0x12345678?'OK':'FALHOU'));}catch(e){write('ArrayBuffer/DataView: ERRO '+e.message)}try{var t=new Uint8Array(4);t[0]=42;write('TypedArray: '+(t[0]===42?'OK':'FALHOU'));}catch(e){write('TypedArray: ERRO '+e.message)}try{if(typeof BigInt==='function'){var x=BigInt('9007199254740993');write('BigInt: '+(String(x)==='9007199254740993'?'OK':'FALHOU'));}else{write('BigInt: indisponível')}}catch(e){write('BigInt: ERRO '+e.message)}write('AppCache API: '+('applicationCache' in window?'disponível':'indisponível'));write('CacheStorage API: '+('caches' in window?'disponível':'indisponível'));write('Service Worker API: '+(navigator.serviceWorker?'disponível':'indisponível'));write('Web Worker: iniciando teste...');if(typeof Worker==='undefined'){write('Web Worker: indisponível');return}var worker=null,finished=false;function done(msg){if(finished)return;finished=true;write(msg);if(worker)worker.terminate()}try{var source='self.onmessage=function(e){self.postMessage("pong:"+e.data)}';var blob=new Blob([source],{type:'application/javascript'});var url=URL.createObjectURL(blob);worker=new Worker(url);worker.onmessage=function(e){done('Web Worker: '+(e.data==='pong:ping'?'OK':'resposta inesperada'));URL.revokeObjectURL(url)};worker.onerror=function(e){done('Web Worker: ERRO de execução');URL.revokeObjectURL(url)};worker.postMessage('ping');setTimeout(function(){done('Web Worker: sem resposta em 5 segundos');URL.revokeObjectURL(url)},5000)}catch(e){done('Web Worker: ERRO '+e.message)}}})();</script></body></html>
